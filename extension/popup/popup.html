<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=360" />
  <title>teChia Jobs</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">teChia Jobs</span>
      </div>
      <span class="badge" id="stats-badge">…</span>
    </header>

    <section class="stats">
      <div class="stat">
        <span class="stat-value" id="streak-value">0</span>
        <span class="stat-label">Day streak</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="apps-value">0</span>
        <span class="stat-label">Active apps</span>
      </div>
    </section>

    <main class="actions">
      <button id="save-job" class="btn btn-primary">Save this Job to teChia Jobs</button>
      <button id="autofill" class="btn btn-secondary">AI Auto-Fill Form</button>
    </main>

    <section class="meta">
      <label class="field">
        <span>App URL</span>
        <input id="app-url" type="url" placeholder="https://techiadigital.com" />
      </label>
      <label class="field">
        <span>API token (optional)</span>
        <input id="api-token" type="password" placeholder="Paste token" />
      </label>
      <button id="save-settings" class="btn btn-ghost">Save settings</button>
    </section>

    <footer class="popup-footer">
      <span id="status" class="status"></span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
